services:
  postgres:
    image: postgres:16
    container_name: sailingloc_postgres
    restart: always
    environment:
      POSTGRES_DB: sailingloc_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: sailingloc_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sailingloc.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: