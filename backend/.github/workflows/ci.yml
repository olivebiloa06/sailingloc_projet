name: SailingLoc CI — Tests Jest

on:
  push:
    branches: [dev, main, "feature/**"]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    name: Tests unitaires Jest
    runs-on: ubuntu-latest

    services:
      # Base de données PostgreSQL pour les tests d'intégration (optionnel)
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: sailingloc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances backend
        working-directory: backend
        run: npm ci

      - name: Créer le fichier .env de test
        working-directory: backend
        run: |
          cat > .env << EOF
          NODE_ENV=test
          PORT=5001
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=sailingloc_test
          DB_USER=postgres
          DB_PASS=postgres
          JWT_SECRET=test_secret_jest_sailingloc
          JWT_REFRESH_SECRET=test_refresh_secret_jest
          STRIPE_SECRET_KEY=sk_test_dummy
          STRIPE_WEBHOOK_SECRET=whsec_dummy
          PAYPAL_CLIENT_ID=dummy
          PAYPAL_CLIENT_SECRET=dummy
          EMAIL_USER=test@test.fr
          EMAIL_PASS=dummy
          FRONTEND_URL=http://localhost:5173
          EOF

      - name: Lancer les tests Jest avec couverture
        working-directory: backend
        run: npm run test:ci

      - name: Publier le rapport de couverture
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: backend/coverage
          flags: backend
          name: sailingloc-backend

      - name: Résumé des tests
        if: always()
        run: |
          echo "## Résultats des tests SailingLoc" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests unitaires Jest exécutés" >> $GITHUB_STEP_SUMMARY
          echo "📊 Couverture minimale requise : 70%" >> $GITHUB_STEP_SUMMARY

  lint:
    name: Vérification qualité code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer dépendances backend
        working-directory: backend
        run: npm ci

      - name: Vérification syntaxe Node.js
        working-directory: backend
        run: |
          find src -name "*.js" | head -20 | xargs -I{} node --check {}
          echo "✅ Syntaxe OK"

      - name: Installer dépendances frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend (vérification compilation)
        working-directory: frontend
        run: npm run build
